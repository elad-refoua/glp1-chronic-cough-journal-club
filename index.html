<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GLP-1RA ושיעול כרוני · Journal club</title>
<meta name="description" content="Journal-club portal: Gallagher et al., GLP-1 receptor agonists and chronic cough, JAMA Otolaryngology-Head & Neck Surgery 2025.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1d2e; --deep:#172a42; --raise:#1f3654; --line:#2f4a6d;
  --paper:#edf2f7; --muted:#b3c1d1; --faint:#7f93ab;
  --mucosa:#f29d9b; --mucosa-d:#c9706f; --ice:#8fc3e8; --amber:#f2c46d; --sage:#93d4ad;
  --r-s:8px; --r-m:14px;
  --ease:cubic-bezier(.16,.72,.24,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Rubik',system-ui,sans-serif;background:var(--night);color:var(--paper);font-size:17px;line-height:1.6;overflow:hidden;
  font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
bdi{unicode-bidi:isolate;white-space:nowrap}
bdi.w{white-space:normal}
svg{direction:ltr}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.12}
p{margin:0 0 .8em}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;inset-inline:0;z-index:60;background:linear-gradient(180deg,rgba(15,29,46,.96) 55%,rgba(15,29,46,0));padding-bottom:10px}
.hud .row{display:flex;align-items:center;gap:12px;padding:10px 18px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.brand svg{flex:none}
.dots{display:flex;margin-inline:auto;align-items:flex-start;overflow-x:auto;scrollbar-width:none;padding:4px 2px;min-width:0}
.dots::-webkit-scrollbar{display:none}
.dots{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.dots button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0 7px;flex:0 0 auto;position:relative;min-width:46px}
.dots button::before{content:'';position:absolute;top:6px;inset-inline-end:50%;width:100%;height:2px;background:var(--line)}
.dots button:first-child::before{display:none}
.dots button.done::before,.dots button.on::before{background:var(--mucosa-d)}
.dots .cir{width:12px;height:12px;border-radius:50%;background:var(--line);position:relative;z-index:1;transition:transform .25s,background .25s}
.dots .lbl{font-size:11px;color:var(--faint);font-weight:500;white-space:nowrap}
.dots button.done .cir{background:var(--mucosa-d)}
.dots button.on .cir{background:var(--paper);transform:scale(1.3);box-shadow:0 0 0 4px rgba(242,157,155,.4)}
.dots button.on .lbl{color:var(--paper)}
.counter{font-size:13px;color:var(--muted);min-width:46px;text-align:center;direction:ltr}
.hbtn{border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--muted)}
@media (max-width:900px){.dots .lbl{display:none}.dots button{min-width:22px;padding:0 4px}.brand span{display:none}}
@media (max-width:520px){.counter{display:none}.hud .row{gap:8px;padding:8px 12px}}

/* ---------- Stage + 3D screens ---------- */
.stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 45%;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;will-change:transform,opacity;background:var(--night);backface-visibility:hidden}
.bg{position:absolute;inset:0;pointer-events:none}
.bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(143,195,232,.09) 1px,transparent 1.2px);background-size:22px 22px;
  mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.wrap{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:78px 5vw 96px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.inner{margin:auto;width:100%;max-width:1180px}
.grid2{display:grid;grid-template-columns:1fr;gap:28px;align-items:center}
@media (min-width:980px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:56px}}
.title{font-size:clamp(28px,4.2vw,50px);margin-bottom:14px;max-width:22ch}
.lead{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:62ch}
.lead p:last-child{margin-bottom:0}
.panel{background:rgba(23,42,66,.86);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px}
.small{font-size:14px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;margin:18px 0 12px;padding:4px;background:var(--deep);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--night)}
.note{border-inline-start:3px solid var(--mucosa);padding-inline-start:14px;color:var(--paper);max-width:60ch;min-height:4.8em}

/* ---------- Hero ---------- */
.hero{position:relative}
.wave{display:block;width:100%;height:auto;margin-bottom:10px;overflow:visible}
.wave path{fill:none;stroke:var(--mucosa);stroke-width:2;stroke-linejoin:round}
.wave .base{stroke:var(--line);stroke-width:1}
.wave .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.screen.active .wave .draw{animation:draw 3.2s var(--ease) .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.jr{color:var(--ice);font-weight:500;margin-bottom:10px;font-size:clamp(15px,1.5vw,18px)}
.hero h1{font-size:clamp(38px,7.4vw,92px);line-height:1.02;max-width:16ch;margin-bottom:22px;letter-spacing:-.02em}
.hook{font-size:clamp(17px,1.9vw,22px);max-width:56ch;color:var(--paper)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;margin:22px 0 6px;max-width:900px}
.meta dt{font-size:13px;color:var(--faint)}
.meta dd{margin:0;font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.pres{color:var(--faint);font-size:14px;margin-top:12px}
.startbtn{margin-top:20px;display:inline-flex;align-items:center;gap:10px;background:var(--mucosa);color:var(--night);font-weight:800;font-size:17px;padding:14px 26px;border:0;border-radius:12px;cursor:pointer}
.startbtn:hover{background:#f7b3b1}

/* ---------- Question ---------- */
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.reasons li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:rgba(23,42,66,.86);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.reasons h3{font-size:19px;margin-bottom:4px}
.reasons p{margin:0;color:var(--muted);font-size:16px}
.why{font-size:14px;color:var(--mucosa);font-weight:700;margin-bottom:10px}

/* ---------- Mechanisms ---------- */
.pathbtns{display:grid;gap:8px;margin:18px 0 12px}
.pathbtns button{display:flex;gap:12px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--deep);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}
.pathbtns button .sw{width:14px;height:14px;border-radius:50%;flex:none}
.pathbtns button[aria-pressed=true]{border-color:var(--paper);background:var(--raise)}
.mech svg{width:100%;height:auto;max-height:68vh;display:block}
.mech .organ{fill:#21395a;stroke:#46668f;stroke-width:1.5}
.mech .lbl{fill:var(--muted);font-size:13px;font-family:'Rubik',sans-serif}
.mech .pth{fill:none;stroke-width:4;stroke-linecap:round;opacity:.16;transition:opacity .4s}
.mech .pth.on{opacity:1;stroke-dasharray:6 12;animation:flow 1.4s linear infinite}
.mech .glow{opacity:0;transition:opacity .4s}
.mech .glow.on{opacity:1}
@keyframes flow{to{stroke-dashoffset:-36}}
.caveat{margin-top:14px;font-size:15px;color:var(--amber)}

/* ---------- Study ---------- */
.facts{display:grid;gap:0;margin:16px 0 0}
.facts div{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.facts dt{color:var(--faint);font-size:14px}
.facts dd{margin:0;font-size:15px}
.bubbles svg{width:100%;height:auto;display:block}
.chiph{font-size:14px;color:var(--faint);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:4px 11px;font-size:13px}
.chips.miss span{border-style:dashed;color:var(--amber);border-color:rgba(242,196,109,.5);background:none}

/* ---------- Forest ---------- */
.forest{position:relative}
.forest svg{width:100%;height:auto;display:block;overflow:visible}
.forest .row{cursor:pointer;outline:none}
.forest .row .hit{fill:transparent}
.forest .row:hover .hit,.forest .row:focus-visible .hit,.forest .row.sel .hit{fill:rgba(143,195,232,.09)}
.forest .row:focus-visible .hit{stroke:var(--amber);stroke-width:2}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--paper);color:var(--night);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.45;box-shadow:0 14px 40px -12px rgba(0,0,0,.7);max-width:300px;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip.dock{position:static;max-width:none;margin-top:6px;transition:none}
.tip.dock:not(.on){display:none}
.tip b{display:block;font-size:15px}
.tip table.tt{border-collapse:collapse;margin-top:6px;width:100%;font-size:13px}
.tip .tt th,.tip .tt td{padding:2px 6px;text-align:end;white-space:nowrap}
.tip .tt th{color:#55667c;font-weight:500}
.tip .tt td:first-child{text-align:start;color:#33465c;white-space:normal}
.tip .ab{display:block;margin-top:6px;color:#8a5a00;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-inline-end:6px}

/* ---------- Absolute risk ---------- */
.bigpair{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 10px}
.bigpair div{min-width:120px}
.bigpair .n{font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1;direction:ltr;display:block}
.bigpair .l{font-size:14px;color:var(--muted)}
.arrays{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.arrays figure{margin:0}
.arrays svg{width:100%;height:auto;display:block}
.arrays figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.quote{margin-top:12px;font-size:15px;color:var(--muted)}
.quote q{color:var(--paper);font-style:italic;quotes:none}
.foot{font-size:13px;color:var(--faint);margin-top:12px;max-width:70ch}

/* ---------- Acting ---------- */
.actrows{display:grid;gap:10px;margin-top:14px}
.actrows div{background:rgba(23,42,66,.86);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.actrows b{display:block}
.points{margin:16px 0 0;padding-inline-start:20px;display:grid;gap:10px;color:var(--muted)}
.points li::marker{color:var(--mucosa)}

/* ---------- Errors ---------- */
.errgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:20px}
.err{background:rgba(23,42,66,.86);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.err .wh{font-size:13px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.err .a{font-weight:700;font-size:16px}
.err .b{display:none;color:var(--paper);font-size:15px;border-top:1px dashed var(--line);padding-top:8px}
.err.open{border-color:var(--amber)}
.err.open .b{display:block}
.err button{align-self:flex-start;border:1px solid var(--amber);color:var(--amber);background:none;border-radius:8px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer}
.err.open button{display:none}
.verdict{margin-top:16px;font-size:17px;max-width:70ch}
.found{font-size:14px;color:var(--amber);font-weight:700}

/* ---------- Flip cards ---------- */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:20px}
.flip{perspective:1200px;border:0;background:none;padding:0;cursor:pointer;text-align:start;display:grid}
.flip .fi{display:grid;transition:transform .8s var(--ease);transform-style:preserve-3d}
.flip[aria-pressed=true] .fi{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-m);padding:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.flip .front{background:linear-gradient(160deg,var(--raise),var(--deep))}
.flip .front h3{font-size:22px}
.flip .front .q{color:var(--ice);font-size:16px}
.flip .front .k{margin-top:auto;font-size:13px;color:var(--faint)}
.flip .back{background:var(--paper);color:var(--night);transform:rotateY(180deg);font-size:14.5px;line-height:1.5}
.flip .back h3{font-size:16px;color:var(--mucosa-d)}
.flip .back .k{margin-top:auto;font-size:12px;color:#55667c}

/* ---------- Hill ---------- */
.hill{display:grid;gap:0;margin-top:18px}
.hill .r{display:grid;grid-template-columns:minmax(120px,170px) 108px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hill .h{font-weight:700}
.meter{display:flex;gap:4px}
.meter i{width:22px;height:10px;border-radius:3px;background:var(--line)}
.meter i.f{background:var(--mucosa)}
.hill .s{font-size:12px;color:var(--faint);display:block}
.hill .p{color:var(--muted);font-size:15px}
@media (max-width:640px){.hill .r{grid-template-columns:1fr auto}.hill .p{grid-column:1/-1}}
.settle{margin-top:20px}
.settle ul{margin:8px 0 0;padding-inline-start:20px;color:var(--muted);display:grid;gap:6px}

/* ---------- Checklist ---------- */
.checks{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px;max-width:820px}
.checks label{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:rgba(23,42,66,.86);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.checks input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--mucosa);cursor:pointer}
.checks input:checked+span{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--mucosa-d)}
.prog{font-size:14px;color:var(--mucosa);font-weight:700;margin-top:12px}

/* ---------- Quiz ---------- */
.quiz{max-width:820px}
.qbar{display:flex;gap:6px;margin:18px 0 14px}
.qbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--sage)}.qbar i.no{background:var(--mucosa)}.qbar i.cur{background:var(--paper)}
.qq{font-size:clamp(19px,2.2vw,24px);font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opts button{text-align:start;border:1px solid var(--line);background:var(--deep);border-radius:12px;padding:12px 16px;cursor:pointer;font-size:16px}
.opts button:hover:not(:disabled){border-color:var(--muted)}
.opts button:disabled{cursor:default}
.opts button.ok{border-color:var(--sage);background:rgba(147,212,173,.16)}
.opts button.no{border-color:var(--mucosa);background:rgba(242,157,155,.14)}
.fb{margin-top:14px;min-height:3em}
.fb b.ok{color:var(--sage)}.fb b.no{color:var(--mucosa)}
.qnext{margin-top:12px;border:0;background:var(--paper);color:var(--night);font-weight:800;border-radius:10px;padding:10px 18px;cursor:pointer}

/* ---------- Closing ---------- */
.cite{font-size:clamp(16px,1.7vw,19px);background:var(--paper);color:var(--night);border-radius:var(--r-m);padding:20px 22px;direction:ltr;text-align:left;max-width:860px;overflow-wrap:anywhere}
.cbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cbtns button{border:1px solid var(--line);background:var(--deep);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.cnotes{margin-top:22px;color:var(--muted);max-width:70ch;padding-inline-start:20px}
.cnotes li{margin-bottom:6px}
.cnotes li:first-child{color:var(--paper);font-weight:700}

/* ---------- Controls + overview ---------- */
.controls{position:fixed;bottom:0;inset-inline:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(15,29,46,.97) 55%,rgba(15,29,46,0))}
.nav{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:10px 18px;border-radius:11px;border:1px solid var(--line);background:var(--deep);cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.nav.primary{background:var(--paper);color:var(--night);border-color:transparent}
.hint{font-size:12px;color:var(--faint);text-align:center;flex:1}
@media(max-width:600px){.hint{display:none}}
.overview{position:fixed;inset:0;z-index:80;background:rgba(10,20,33,.95);backdrop-filter:blur(8px);display:none;overflow-y:auto;padding:70px 5vw 40px}
.overview.on{display:block}
.overview .close{position:fixed;top:14px;inset-inline-end:18px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.ovgrid button{text-align:start;border:1px solid var(--line);background:var(--deep);border-radius:var(--r-m);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px}
.ovgrid button .num{font-size:28px;font-weight:800;color:var(--mucosa);line-height:1}
.ovgrid button.cur{border-color:var(--paper)}
.ovgrid button .nm{font-weight:700}

@media (prefers-reduced-motion: reduce){
  .screen.active .wave .draw{animation:none;stroke-dashoffset:0}
  .mech .pth.on{animation:none;stroke-dasharray:none}
  .flip .fi{transition:none}
  .flip .face{transition:opacity .2s}
  .flip[aria-pressed=true] .fi{transform:none}
  .flip .back{transform:none;opacity:0}
  .flip[aria-pressed=true] .back{opacity:1}
  .flip[aria-pressed=true] .front{opacity:0}
}
</style>
</head>
<body>
<header class="hud"><div class="row">
  <div class="brand"><svg width="30" height="16" viewBox="0 0 30 16" aria-hidden="true"><path d="M0 8h6l2-6 3 12 3-10 2 6 2-3h12" fill="none" stroke="#f29d9b" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="brand"></span></div>
  <nav class="dots" id="dots" aria-label="Screens"></nav>
  <span class="counter" id="counter"></span>
  <button class="hbtn" id="mapbtn" aria-haspopup="dialog"></button>
  <button class="hbtn" id="langbtn"></button>
</div></header>
<main class="stage" id="stage"></main>

<script type="application/json" id="data">{"screens":[{"id":"hero","type":"hero","nav":{"he":"פתיחה","en":"Opening"},"he":{"journal":"JAMA Otolaryngology–Head & Neck Surgery","title":"תרופות <bdi>GLP-1<\/bdi> ושיעול כרוני","hook":"בקרב יותר משני מיליון חולי סוכרת סוג <bdi>2<\/bdi>, מי שקיבלו <bdi>GLP-1RA<\/bdi> קיבלו אבחנה חדשה של שיעול כרוני בסיכון יחסי גבוה ב-<bdi>12%<\/bdi>. בסיכון מוחלט מדובר בכ-<bdi>0.4<\/bdi> נקודות אחוז בחמש שנים. האם זה מספיק כדי לשנות את האנמנזה במרפאה?","pubL":"פורסם ברשת","pub":"<bdi>26<\/bdi> בנובמבר <bdi>2025<\/bdi>","authL":"מחברים","authors":"Gallagher TJ, Razura DE, Li A, Kim I, Vukkadala N, Barbu AM","presented":"מועדון ז׳ורנל, מחלקת אף-אוזן-גרון וניתוחי ראש-צוואר, מרכז רפואי קפלן. מציג: נתנאל רפואה"},"en":{"journal":"JAMA Otolaryngology–Head & Neck Surgery","title":"GLP-1 receptor agonists and chronic cough","hook":"Among more than two million adults with type 2 diabetes, those prescribed a GLP-1RA received a new chronic-cough diagnosis at a 12% higher relative hazard. In absolute terms that is about 0.4 percentage points over five years. Is that enough to change the history we take in clinic?","pubL":"Published online","pub":"26 November 2025","authL":"Authors","authors":"Gallagher TJ, Razura DE, Li A, Kim I, Vukkadala N, Barbu AM","presented":"Journal club, Department of Otolaryngology–Head & Neck Surgery, Kaplan Medical Center. Presenter: Netanel Refoua"}},{"id":"question","type":"question","nav":{"he":"השאלה","en":"Question"},"he":{"title":"השאלה: האם <bdi>GLP-1RA<\/bdi> מעלה את הסיכון לשיעול כרוני חדש?","lead":["שיעול כרוני, שיעול שנמשך יותר מ-<bdi>8<\/bdi> שבועות, נובע בדרך כלל מהחשודים הרגילים: ניקוז אחורי מהאף, אסתמה, ברונכיטיס אאוזינופילית וריפלוקס. אצל חלק מהמטופלים הסיבה לא נמצאת.","המחברים, רובם רופאי אא״ג מלוס אנג׳לס ומאריזונה, שאלו אם תרופה נפוצה מאוד היא חלק מהתשובה החסרה."],"why":"למה זה נוגע לנו","reasons":[{"icon":"pill","h":"כבר היינו כאן","p":"מעכבי <bdi>ACE<\/bdi> לימדו כל רופא אא״ג שתרופה שגרתית יכולה לגרום לשיעול כרוני שאף לרינגוסקופיה לא תסביר. הבירור מתחיל ברשימת התרופות."},{"icon":"boom","h":"הבום של <bdi>GLP-1RA<\/bdi>","p":"מתרופת קו שני לסוכרת לתרופת הרזיה נפוצה. הרבה מטופלים מקבלים אותה שלא לפי ההתוויה הרשומה, מרופא מחוץ לצוות הקבוע, ולא יזכירו אותה מעצמם."},{"icon":"nerve","h":"העצב התועה","p":"רפלקס השיעול רץ על סיבים אפרנטיים של הווגוס. תרופות <bdi>GLP-1RA<\/bdi> מאטות את התרוקנות הקיבה ומגרות איתות אפרנטי וגאלי."}]},"en":{"title":"The question: does a GLP-1RA raise the risk of new chronic cough?","lead":["Chronic cough, a cough lasting more than 8 weeks, usually comes from the familiar suspects: postnasal drip, asthma, eosinophilic bronchitis and reflux. In a subset of patients no cause is found.","The authors, mostly otolaryngologists in Los Angeles and Arizona, asked whether a very common drug is part of the missing answer."],"why":"Why this is our problem","reasons":[{"icon":"pill","h":"We have been here before","p":"ACE inhibitors taught every ENT that a routine drug can cause a chronic cough no laryngoscopy will explain. The work-up starts with the medication list."},{"icon":"boom","h":"The GLP-1RA boom","p":"From second-line diabetes drug to everyday weight-loss drug. Many patients take it off label, prescribed outside their usual team, and will not mention it unless asked."},{"icon":"nerve","h":"The vagus","p":"The cough reflex runs on vagal afferents. GLP-1RAs slow gastric emptying and stimulate vagal afferent signalling."}]}},{"id":"mechanisms","type":"mech","nav":{"he":"מנגנונים","en":"Mechanisms"},"he":{"title":"שלוש דרכים אפשריות מהזריקה אל הגרון","lead":"המחברים מציעים שלושה מנגנונים. בחרו מסלול כדי לראות אותו בתרשים.","paths":[{"key":"reflux","h":"ריפלוקס דרך התרוקנות קיבה איטית","p":"הקיבה מתרוקנת לאט, התוכן עולה. לפי המחברים, הדגש הוא על <bdi>LPR<\/bdi>, שנקרא לפעמים 'ריפלוקס שקט' או 'ריפלוקס של דרכי האוויר', ועל מיקרו-אספירציה, ולא על <bdi>GERD<\/bdi> חומצי קלאסי. קודי <bdi>GERD<\/bdi> באבחנות <bdi>ICD<\/bdi> מפספסים חלק גדול מזה, ודיכוי חומצה לבדו עלול לא להספיק."},{"key":"vagal","h":"גירוי ישיר של סיבי הווגוס","p":"תרופות <bdi>GLP-1RA<\/bdi> מגרות איתות אפרנטי וגאלי. דווח על קולטני <bdi>GLP-1<\/bdi> באפיתל דרכי הנשימה ובכלי הדם של הריאה, אם כי הביטוי שלהם ברקמות אדם עדיין שנוי במחלוקת. מכאן אפשר לחשוב על שיעול ממקור עצבי."},{"key":"dry","h":"יובש בפה ובגרון","p":"קסרוסטומיה היא תופעת לוואי מוכרת של <bdi>GLP-1RA<\/bdi>. גרון יבש הוא טריגר אפשרי לשיעול."}],"caveat":"שלושתם השערות. המחקר לא מדד אף אחד מהם: לא <bdi>pH<\/bdi>-אימפדנס, לא לרינגוסקופיה, לא ספי רגישות לשיעול.","labels":{"brain":"גזע המוח","larynx":"גרון","mouth":"בלוטות רוק","lungs":"ריאות","stomach":"קיבה","vagus":"עצב הווגוס","eso":"ושט"}},"en":{"title":"Three possible roads from the injection to the larynx","lead":"The authors propose three mechanisms. Pick a pathway to trace it on the diagram.","paths":[{"key":"reflux","h":"Reflux through slow gastric emptying","p":"The stomach empties slowly and contents travel upward. The authors stress LPR (often called silent or 'airway' reflux) and microaspiration rather than classic acid GERD. ICD GERD codes miss much of this, and acid suppression alone may not be enough."},{"key":"vagal","h":"Direct vagal stimulation","p":"GLP-1RAs stimulate vagal afferent signalling. GLP-1 receptors have been reported in airway epithelium and lung vasculature, although their expression in human tissue is still debated. That points toward a neurogenic cough."},{"key":"dry","h":"A dry mouth and a dry larynx","p":"Xerostomia is a known GLP-1RA side effect. A dry larynx is a plausible cough trigger."}],"caveat":"All three are hypotheses. The study measured none of them: no pH-impedance, no laryngoscopy, no cough-sensitivity thresholds.","labels":{"brain":"Brainstem","larynx":"Larynx","mouth":"Salivary glands","lungs":"Lungs","stomach":"Stomach","vagus":"Vagus nerve","eso":"Oesophagus"}}},{"id":"study","type":"study","nav":{"he":"המחקר","en":"The study"},"he":{"title":"המחקר במבט אחד","lead":"מחקר עוקבה רטרוספקטיבי ברשומות רפואיות אלקטרוניות. גודל העיגולים בתרשים יחסי למספר המטופלים בכל קבוצה לפני ההתאמה.","facts":[["מקור","<bdi>TriNetX<\/bdi>, הרשת השיתופית בארה״ב: <bdi>70<\/bdi> ארגוני בריאות, יותר מ-<bdi>105<\/bdi> מיליון מטופלים"],["תקופה","<bdi>28<\/bdi> באפריל <bdi>2005<\/bdi> עד <bdi>15<\/bdi> באפריל <bdi>2025<\/bdi>"],["אוכלוסייה","מבוגרים <bdi>(18+)<\/bdi> עם סוכרת סוג <bdi>2<\/bdi> (קוד <bdi>E11<\/bdi>) ומרשם ראשון לתרופת קו שני"],["תכנון","התאמת ציון נטייה <bdi>1:1<\/bdi> (השכן הקרוב, <bdi>caliper<\/bdi> של <bdi>0.1 SD<\/bdi>), ואחריה רגרסיית <bdi>Cox<\/bdi> ליחס סיכונים מתוקנן <bdi>(aHR)<\/bdi>"],["תוצא","אבחנה ראשונה של שיעול כרוני בקוד <bdi>ICD-10<\/bdi>, בתוך <bdi>5<\/bdi> שנים; מי שהיה לו שיעול קודם הוצא"],["משני ורגישות","<bdi>GERD<\/bdi> חדש; קבוצות בלי אבחנת <bdi>GERD<\/bdi> אף פעם; <bdi>GLP-1RA<\/bdi> קצר מול ארוך טווח"],["מעקב חציוני","<bdi>701<\/bdi> מול <bdi>643<\/bdi> ימים (<bdi>GLP-1RA<\/bdi> מול כל תרופה אחרת, אחרי התאמה)"]],"chipsH":"הותאמו לפי","chips":["גיל נוכחי","גיל במרשם","מין","גזע","מוצא אתני","COPD","אסתמה","גסטרופרזיס","ברונכיטיס כרונית","GERD","שיעול הקשור ל-<bdi>GERD<\/bdi>","נזלת כרונית","ניקוז אחורי מהאף","אי-ספיקת לב","עישון","עודף משקל","השמנה","מטפורמין","אינסולין","<bdi>5<\/bdi> מעכבי <bdi>ACE<\/bdi> נבחרים"],"missingH":"לא הותאמו","missing":["BMI","HbA1c","<bdi>ARB<\/bdi> ומעכבי <bdi>ACE<\/bdi> אחרים","דום נשימה בשינה","מחלת כליות","כמות עישון"],"bub":{"GLP1RA":"GLP-1RA","DPP4i":"DPP-4i","SGLT2i":"SGLT2i","SU":"SU","any_nonGLP1":"כל תרופה אחרת"}},"en":{"title":"The study at a glance","lead":"A retrospective cohort study of electronic health records. Bubble area is proportional to each group's size before matching.","facts":[["Source","TriNetX US Collaborative Network: 70 healthcare organisations, more than 105 million patients"],["Window","28 April 2005 to 15 April 2025"],["Population","Adults (18+) with type 2 diabetes (code E11) and a first prescription of a second-line drug"],["Design","1:1 propensity-score matching (greedy nearest neighbour, caliper 0.1 SD), then Cox regression for adjusted hazard ratios (aHR)"],["Outcome","First ICD-10 chronic-cough diagnosis within 5 years; anyone with earlier cough excluded"],["Secondary and sensitivity","New GERD; cohorts with no GERD diagnosis ever; short- vs long-acting GLP-1RA"],["Median follow-up","701 vs 643 days (GLP-1RA vs any non-GLP-1RA, matched)"]],"chipsH":"Matched on","chips":["Current age","Age at prescription","Sex","Race","Ethnicity","COPD","Asthma","Gastroparesis","Chronic bronchitis","GERD","GERD-related cough","Chronic rhinitis","Postnasal drip","Heart failure","Tobacco use","Overweight","Obesity","Metformin","Insulin","5 named ACE inhibitors"],"missingH":"Not matched on","missing":["BMI","HbA1c","ARBs and other ACE inhibitors","Sleep apnoea","Kidney disease","Smoking intensity"],"bub":{"GLP1RA":"GLP-1RA","DPP4i":"DPP-4i","SGLT2i":"SGLT2i","SU":"SU","any_nonGLP1":"Any non-GLP-1RA"}}},{"id":"forest","type":"forest","nav":{"he":"התוצאות","en":"Results"},"he":{"title":"התוצאה המרכזית, בגרף יער אינטראקטיבי","lead":"כל שורה היא השוואה של <bdi>GLP-1RA<\/bdi> מול קבוצה אחרת, אחרי התאמה. ימינה מהקו המקווקו פירושו יותר שיעול בקבוצת <bdi>GLP-1RA<\/bdi>.","sets":[{"key":"main","label":"כל המטופלים","note":"שלוש מתוך ארבע ההשוואות מעל <bdi>1<\/bdi>. ההשוואה ל-<bdi>SGLT2i<\/bdi> היא ההשוואה האפסית: היא חוצה את <bdi>1<\/bdi>, <bdi>aHR 1.03 (0.98–1.09)<\/bdi>. העיגול החלול בשורת <bdi>SU<\/bdi> הוא הערך שמופיע בתקציר, <bdi>1.32<\/bdi>, ולא תואם לטבלה."},{"key":"noGERD","label":"בלי <bdi>GERD<\/bdi> אף פעם","note":"כל ארבע ההשוואות מעל <bdi>1<\/bdi>, וחזקות יותר: <bdi>aHR 1.29 (1.17–1.42)<\/bdi> מול כל תרופה אחרת. אבל ההחרגה כוללת <bdi>GERD<\/bdi> גם אחרי תחילת הטיפול. ראו את כרטיס הביקורת על התניה על העתיד."},{"key":"gerd","label":"<bdi>GERD<\/bdi> חדש כתוצא","note":"המתווך המוצע כמעט לא זז מול כל תרופה אחרת: <bdi>aHR 1.01 (0.997–1.03)<\/bdi>, לא מובהק. מול <bdi>SGLT2i<\/bdi> ו-<bdi>SU<\/bdi> יש עלייה של <bdi>13%<\/bdi> ו-<bdi>12%<\/bdi>."}]},"en":{"title":"The main result, as an interactive forest plot","lead":"Each row compares GLP-1RA users with another matched group. Right of the dashed line means more cough in the GLP-1RA group.","sets":[{"key":"main","label":"All patients","note":"Three of four comparisons sit above 1. The SGLT2i comparison is the null one: it crosses 1, aHR 1.03 (0.98–1.09). The hollow ring on the SU row is the value printed in the abstract, 1.32, which does not match the table."},{"key":"noGERD","label":"Never-GERD","note":"All four comparisons sit above 1 and grow: aHR 1.29 (1.17–1.42) vs any non-GLP-1RA. But the exclusion removes GERD diagnosed after the drug was started too. See the appraisal card on conditioning on the future."},{"key":"gerd","label":"New GERD outcome","note":"The proposed mediator barely moves against any non-GLP-1RA: aHR 1.01 (0.997–1.03), not significant. Against SGLT2i and SU it rises 13% and 12%."}]}},{"id":"absolute","type":"risk","nav":{"he":"סיכון מוחלט","en":"Absolute risk"},"he":{"title":"אלף מטופלים, חמש שנים","lead":"יחס סיכונים של <bdi>1.12<\/bdi> נשמע כמו <bdi>12%<\/bdi> יותר. בפועל, מתוך אלף מטופלים, ההבדל הוא כארבעה אנשים.","sets":[{"key":"main","label":"כל המטופלים","a":"≈36","b":"≈31.5","diff":"הפרש של <bdi>0.43<\/bdi> נקודות אחוז (<bdi>3.58%<\/bdi> מול <bdi>3.15%<\/bdi>)","nnh":"<bdi>NNH ≈ 233<\/bdi> בחמש שנים"},{"key":"noGERD","label":"בלי <bdi>GERD<\/bdi> אף פעם","a":"≈18","b":"≈14","diff":"הפרש של <bdi>0.42<\/bdi> נקודות אחוז (<bdi>1.82%<\/bdi> מול <bdi>1.40%<\/bdi>)","nnh":"<bdi>NNH ≈ 238<\/bdi> בחמש שנים"}],"per":"לכל <bdi>1,000<\/bdi>","aL":"GLP-1RA","bL":"קבוצת השוואה","insight":"שימו לב: בקבוצה בלי <bdi>GERD<\/bdi> היחס עולה ל-<bdi>1.29<\/bdi>, אבל ההפרש המוחלט נשאר כמעט זהה, כי הסיכון הבסיסי נמוך יותר.","quote":"גם המחברים כותבים זאת:","quoteText":"“the 5-year absolute risk increase remained small”","quoteSrc":"Gallagher et al., 2025","foot":"הערה על האחוזים: אלה האחוזים שבטבלאות. חישוב גולמי של אירועים חלקי גודל קבוצה נותן כ-<bdi>1.6%<\/bdi> מול כ-<bdi>1.4%<\/bdi> (<bdi>6,077/373,580 = 1.63%<\/bdi> מול <bdi>5,321/375,570 = 1.42%<\/bdi>; הפרש <bdi>0.21<\/bdi> נקודות, <bdi>NNH ≈ 476<\/bdi>). האחוז המודפס גבוה פי <bdi>2.2<\/bdi> בערך. ככל הנראה זו שכיחות מצטברת לפי קפלן-מאייר בחמש שנים, אבל הטבלאות לא אומרות זאת."},"en":{"title":"A thousand patients, five years","lead":"A hazard ratio of 1.12 sounds like 12% more. Out of a thousand patients, the difference is about four people.","sets":[{"key":"main","label":"All patients","a":"≈36","b":"≈31.5","diff":"A difference of 0.43 percentage points (3.58% vs 3.15%)","nnh":"NNH ≈ 233 over five years"},{"key":"noGERD","label":"Never-GERD","a":"≈18","b":"≈14","diff":"A difference of 0.42 percentage points (1.82% vs 1.40%)","nnh":"NNH ≈ 238 over five years"}],"per":"per 1,000","aL":"GLP-1RA","bL":"Comparator","insight":"Notice: in the never-GERD cohort the ratio climbs to 1.29, yet the absolute gap barely changes, because the baseline risk is lower.","quote":"The authors say so too:","quoteText":"“the 5-year absolute risk increase remained small”","quoteSrc":"Gallagher et al., 2025","foot":"About these percentages: they are the ones printed in the tables. Raw events divided by group size give about 1.6% vs 1.4% (6,077/373,580 = 1.63% vs 5,321/375,570 = 1.42%; a 0.21-point difference, NNH ≈ 476). The printed figure is about 2.2 times higher. It is most likely a 5-year Kaplan-Meier cumulative incidence, but the tables do not say so."}},{"id":"acting","type":"acting","nav":{"he":"קצר מול ארוך","en":"Short vs long"},"he":{"title":"קצרי טווח מול ארוכי טווח","lead":"ניתוח חקרני: כל סוג מול כל תרופה אחרת שאינה <bdi>GLP-1RA<\/bdi>.","rows":[{"key":"long","label":"ארוכי טווח","drugs":"ליראגלוטייד, דולאגלוטייד, אלביגלוטייד, סמאגלוטייד","when":"ינואר <bdi>2010<\/bdi> עד אפריל <bdi>2025<\/bdi>"},{"key":"short","label":"קצרי טווח","drugs":"ליקסיסנטייד, אקסנטייד","when":"אפריל <bdi>2005<\/bdi> עד ינואר <bdi>2012<\/bdi>"}],"points":["ארוכי הטווח: <bdi>aHR 1.11 (1.07–1.16)<\/bdi>. קצרי הטווח: <bdi>aHR 0.79 (0.44–1.41)<\/bdi>, רווח סמך רחב מאוד. המחברים עצמם אומרים שאין מספיק עוצמה.","סוג התרופה חופף לתקופה: קצרי הטווח נרשמו כמעט רק לפני <bdi>2012<\/bdi>. ההשוואה היא גם בין עידנים, כולל עידני קידוד.","כיוון הפוך מהצפוי: <bdi>Liu<\/bdi> ועמיתיו <bdi>(Gut, 2024)<\/bdi>, מחקר שהמחברים עצמם מצטטים, מצאו יותר <bdi>GERD<\/bdi> דווקא עם <bdi>GLP-1RA<\/bdi> קצרי טווח. אם הריפלוקס הוא המנגנון, היינו מצפים לאות חזק יותר אצלם."]},"en":{"title":"Short-acting vs long-acting","lead":"An exploratory analysis: each type against any non-GLP-1RA.","rows":[{"key":"long","label":"Long-acting","drugs":"Liraglutide, dulaglutide, albiglutide, semaglutide","when":"January 2010 to April 2025"},{"key":"short","label":"Short-acting","drugs":"Lixisenatide, exenatide","when":"April 2005 to January 2012"}],"points":["Long-acting: aHR 1.11 (1.07–1.16). Short-acting: aHR 0.79 (0.44–1.41), a very wide interval. The authors themselves call it underpowered.","Drug type is tangled with calendar time: short-acting prescriptions come almost entirely from before 2012. The comparison is also between eras, coding eras included.","The direction runs the wrong way: Liu et al. (Gut, 2024), cited by the authors themselves, found more GERD with shorter-acting GLP-1RAs. If reflux were the mechanism, we would expect the stronger signal there."]}},{"id":"errors","type":"errors","nav":{"he":"מצאו את הטעות","en":"Spot the errors"},"he":{"title":"מצאו את הטעות","lead":"עשר אי-התאמות פנימיות במאמר, כולן ניתנות לבדיקה מול ה-<bdi>PDF<\/bdi>. קראו את הקטע, נחשו מה לא מסתדר, ואז חשפו.","items":[{"where":"תקציר","a":"SU: aHR 1.32 (1.24–1.40)","b":"בטקסט התוצאות ובטבלה <bdi>2<\/bdi>: <bdi>aHR 1.25 (1.18–1.32)<\/bdi>. שני ערכים שונים לאותה השוואה."},{"where":"טבלה <bdi>2<\/bdi>","a":"<bdi>6,077<\/bdi> אירועים <bdi>(3.58%)<\/bdi> מתוך <bdi>373,580<\/bdi>","b":"<bdi>6,077<\/bdi> חלקי <bdi>373,580<\/bdi> הם <bdi>1.63%<\/bdi>, לא <bdi>3.58%<\/bdi>. האחוזים בטבלאות <bdi>2<\/bdi> ו-<bdi>3<\/bdi> גבוהים פי <bdi>2.2<\/bdi> בערך. כנראה שכיחות מצטברת לפי קפלן-מאייר, בלי שזה כתוב."},{"where":"Key Points","a":"<bdi>1,614,495<\/bdi> משתתפים מותאמים","b":"זה המספר הכולל לפני ההתאמה. קבוצת ההשוואה המותאמת הגדולה ביותר מונה <bdi>375,570<\/bdi>."},{"where":"טבלה <bdi>1<\/bdi>, <bdi>DPP-4i<\/bdi>","a":"נשים <bdi>49.4%<\/bdi>, גברים <bdi>48.1%<\/bdi>, לא ידוע <bdi>2.5%<\/bdi>","b":"מהמספרים עצמם יוצא <bdi>47.4%<\/bdi>, <bdi>46.1%<\/bdi> ו-<bdi>6.5%<\/bdi>. אותה בעיה בעמודות <bdi>SU<\/bdi> וכל תרופה אחרת."},{"where":"טקסט התוצאות","a":"GLP-1RAs ( [11.5%])","b":"המספר חסר. בטבלה <bdi>1<\/bdi>: <bdi>33,031<\/bdi>."},{"where":"הערת שוליים, טבלה <bdi>3<\/bdi>","a":"רשימת משתני ההתאמה","b":"אינסולין חסר ברשימה, אף שבטבלה <bdi>2<\/bdi> הוא מופיע."},{"where":"טבלאות <bdi>2<\/bdi> ו-<bdi>3<\/bdi>","a":"<bdi>373,580<\/bdi> מול <bdi>375,570<\/bdi> בהתאמה של <bdi>1:1<\/bdi>","b":"בהתאמה של <bdi>1:1<\/bdi> הקבוצות אמורות להיות שוות. ההסבר בהערת השוליים: הוצאו מי שהתוצא שלהם קרה מחוץ לחלון הזמן."},{"where":"תקציר ושיטות","a":"SLGT2","b":"שגיאת כתיב: צריך להיות <bdi>SGLT2<\/bdi>."},{"where":"תקציר מול שיטות","a":"הוצאו מטופלים עם אבחנת <bdi>GERD<\/bdi> קודמת","b":"בשיטות: הוצאו כל מי שקיבלו אבחנת <bdi>GERD<\/bdi> לפני תחילת הטיפול או אחריה. התקציר מתאר החרגה צרה יותר מזו שבוצעה בפועל."},{"where":"טבלה <bdi>1<\/bdi>","a":"כל תרופה אחרת: <bdi>1,614,495<\/bdi>","b":"שלוש הקבוצות הבודדות יחד: <bdi class=\"w\">283,321 + 321,508 + 484,113 = 1,088,942<\/bdi>. יותר מ-<bdi>525,000<\/bdi> מטופלים בקבוצה המאוחדת לא מוסברים."}],"verdict":"אף אחת מהן לא הופכת את כיוון הממצא. יחד הן אומרות שכתב היד לא נבדק מקרוב."},"en":{"title":"Spot the errors","lead":"Ten internal inconsistencies, each checkable against the PDF. Read the snippet, guess what is off, then reveal.","items":[{"where":"Abstract","a":"SU: aHR 1.32 (1.24–1.40)","b":"Results text and Table 2: aHR 1.25 (1.18–1.32). Two different values for the same comparison."},{"where":"Table 2","a":"6,077 events (3.58%) out of 373,580","b":"6,077 divided by 373,580 is 1.63%, not 3.58%. The percentages in Tables 2 and 3 are about 2.2 times events over group size. Probably Kaplan-Meier cumulative incidence, never labelled."},{"where":"Key Points","a":"1,614,495 matched individuals","b":"That is the total before matching. The largest matched comparator group is 375,570."},{"where":"Table 1, DPP-4i","a":"Female 49.4%, male 48.1%, unknown 2.5%","b":"The counts give 47.4%, 46.1% and 6.5%. The SU and any non-GLP-1RA columns have the same problem."},{"where":"Results text","a":"GLP-1RAs ( [11.5%])","b":"The count is missing. Table 1 gives 33,031."},{"where":"Table 3 footnote","a":"The list of matching variables","b":"Insulin is missing from the list, although Table 2 includes it."},{"where":"Tables 2 and 3","a":"373,580 vs 375,570 after 1:1 matching","b":"1:1 matching should give equal groups. The footnote: people whose outcomes fell outside the time window were removed."},{"where":"Abstract and Methods","a":"SLGT2","b":"A typo for SGLT2."},{"where":"Abstract vs Methods","a":"Patients with a previous GERD diagnosis were removed","b":"Methods: anyone with a GERD diagnosis before or after the index prescription was excluded. The abstract describes a narrower exclusion than the one performed."},{"where":"Table 1","a":"Any non-GLP-1RA: 1,614,495","b":"The three single-class cohorts together: 283,321 + 321,508 + 484,113 = 1,088,942. More than 525,000 patients in the pooled cohort are unaccounted for."}],"verdict":"None of these flips the direction of the finding. Together they say the manuscript was not checked closely."}},{"id":"appraisal","type":"flip","nav":{"he":"ביקורת","en":"Appraisal"},"he":{"title":"ביקורת: מה עוד יכול להסביר את התוצאה?","lead":"שבע נקודות, בערך לפי הכוח שלהן להסביר את הממצא. הפכו כל כרטיס.","cards":[{"h":"השמנה ו-<bdi>BMI<\/bdi>","q":"מי מקבל <bdi>GLP-1RA<\/bdi>, ולמה?","b":"אין <bdi>BMI<\/bdi> בנתונים. לפני ההתאמה, משתמשי <bdi>GLP-1RA<\/bdi> צעירים ב-<bdi>7.9<\/bdi> שנים, <bdi>58.9%<\/bdi> נשים לעומת <bdi>44.4%<\/bdi>, ורבים מקבלים את התרופה בגלל משקל. השמנה לבדה מעלה ריפלוקס ושיעול, וקודי השמנה ב-<bdi>ICD<\/bdi> הם תחליף חלש. מין נשי הוא גורם ידוע לרגישות-יתר לשיעול; התאמה לפי מין מאזנת את הממוצע, לא אינטראקציות."},{"h":"הטיית גילוי","q":"מי נבדק יותר, מקבל יותר אבחנות?","b":"סביר שמשתמשי <bdi>GLP-1RA<\/bdi> מגיעים ליותר ביקורים בשנה: טיטרציה, תופעות לוואי במערכת העיכול. יותר מגע עם המערכת פירושו יותר הזדמנויות לכל קוד חדש. המאמר לא מדווח על מספר הביקורים. תוצא ביקורת שלילי (למשל ציפורן חודרנית או קטרקט) היה בודק זאת, ולא נעשה."},{"h":"ה-<bdi>SGLT2i<\/bdi> האפסי","q":"מה קורה מול <bdi>SGLT2i<\/bdi>?","b":"ההשוואה ל-<bdi>SGLT2i<\/bdi> היא ההשוואה האפסית: <bdi>aHR 1.03 (0.98–1.09)<\/bdi>. זה לא הופך אותה להשוואה ההוגנת ביותר: משתמשי <bdi>SGLT2i<\/bdi> הם הכי פחות דומים למשתמשי <bdi>GLP-1RA<\/bdi> במין (<bdi>38.3%<\/bdi> נשים לעומת <bdi>58.9%<\/bdi>, לפני ההתאמה). בניתוח בלי <bdi>GERD<\/bdi>, ההשוואה ל-<bdi>SGLT2i<\/bdi> היא הנמוכה מבין הארבע: <bdi>1.14 (1.02–1.28)<\/bdi>."},{"h":"התניה על העתיד","q":"מה עושה החרגה של <bdi>GERD<\/bdi> ׳לפני או אחרי׳?","b":"בניתוח הרגישות הוצאו כל מי שקיבלו אבחנת <bdi>GERD<\/bdi> לפני תחילת הטיפול או אחריה. זו בחירה לפי משתנה שקרה אחרי החשיפה. אם <bdi>GLP-1RA<\/bdi> גורם לריפלוקס שמקודד כ-<bdi>GERD<\/bdi>, ההחרגה מוציאה בדיוק את המקרים שבהם הריפלוקס הוא המתווך. לכן קשה לקרוא את <bdi>1.29<\/bdi> כ׳בלתי תלוי ב-<bdi>GERD<\/bdi>׳."},{"h":"עידן הקידוד","q":"שאלה לבדיקה, לא ממצא","b":"הקוד הייעודי <bdi>R05.3<\/bdi> לשיעול כרוני קיים ב-<bdi>ICD-10-CM<\/bdi> רק מ-<bdi>1<\/bdi> באוקטובר <bdi>2021<\/bdi>. השימוש ב-<bdi>GLP-1RA<\/bdi> זינק אחרי <bdi>2021<\/bdi>, ואילו <bdi>SU<\/bdi> ו-<bdi>DPP-4i<\/bdi> התחילו ברובם לפני כן. אם <bdi>eTable 1<\/bdi> משתמש ב-<bdi>R05.3<\/bdi>, עידן החשיפה וזמינות קוד התוצא מתערבבים. הקודים מופיעים בנספח שאין בידינו, אז זו שאלה לאמת."},{"h":"משתמשים קיימים","q":"האם זה באמת תכנון של משתמשים חדשים?","b":"׳מרשם ראשון שנרשם ברשת׳ אינו תכנון של משתמשים חדשים: אין תקופת שטיפה, אין הגדרה של <bdi>as-treated<\/bdi> או <bdi>intention-to-treat<\/bdi>, ואין נתונים על היענות, מינון, משך טיפול או מעבר בין תרופות."},{"h":"E-value","q":"כמה חזק צריך להיות גורם מערפל?","b":"המאמר לא מדווח <bdi>E-value<\/bdi>, אז חישבנו: <bdi>1.49<\/bdi> ל-<bdi>aHR 1.12<\/bdi> (<bdi>1.37<\/bdi> לגבול רווח הסמך), ו-<bdi>1.90 (1.62)<\/bdi> לניתוח בלי <bdi>GERD<\/bdi>. גורם מערפל שקשור גם לשימוש ב-<bdi>GLP-1RA<\/bdi> וגם לשיעול ביחס סיכון של כ-<bdi>1.5<\/bdi> לכל כיוון יכול להסביר את כל הממצא העיקרי. האם השמנה חזקה כזאת? סביר."}]},"en":{"title":"Appraisal: what else could explain the result?","lead":"Seven points, roughly ranked by how much of the finding they could explain. Flip each card.","cards":[{"h":"Obesity and BMI","q":"Who gets a GLP-1RA, and why?","b":"There is no BMI in the data. Before matching, GLP-1RA users are 7.9 years younger and 58.9% female vs 44.4%, and many are prescribed for weight. Obesity alone raises reflux and cough, and ICD obesity codes are a weak proxy. Female sex is a known cough-hypersensitivity factor; matching on sex balances the mean, not interactions."},{"h":"Detection bias","q":"Who is seen more, gets coded more?","b":"GLP-1RA users plausibly come in more often per year: titration visits, GI side effects. More contact means more chances to receive any new code. The paper reports no visit counts. A negative-control outcome (an ingrown toenail, a cataract) would test this. None was run."},{"h":"The SGLT2i null","q":"What happens against SGLT2i?","b":"The SGLT2i comparison is the null one: aHR 1.03 (0.98–1.09). That does not make it the fairest comparator: SGLT2i users are the least like GLP-1RA users in sex (38.3% vs 58.9% female, before matching). In the never-GERD analysis the SGLT2i comparison is the lowest of the four: 1.14 (1.02–1.28)."},{"h":"Conditioning on the future","q":"What does excluding GERD 'before or after' do?","b":"The sensitivity analysis removed anyone with a GERD code before or after the index prescription. That is selection on a post-exposure variable. If a GLP-1RA causes reflux that gets coded as GERD, the exclusion removes precisely the reflux-mediated cases. So 1.29 is hard to read as 'independent of GERD'."},{"h":"The coding era","q":"A question to verify, not a finding","b":"The specific ICD-10-CM code R05.3 for chronic cough exists only from 1 October 2021. GLP-1RA use surged after 2021, while SU and DPP-4i users mostly started earlier. If eTable 1 uses R05.3, exposure era and outcome-code availability are confounded. The codes sit in a supplement we do not have, so treat this as a question."},{"h":"Prevalent users","q":"Is this really a new-user design?","b":"'First recorded prescription in the network' is not a new-user design: no washout, no as-treated or intention-to-treat definition, and no data on adherence, dose, duration or switching."},{"h":"E-value","q":"How strong would a confounder have to be?","b":"The paper reports no E-value, so we computed one: 1.49 for the aHR of 1.12 (1.37 for its confidence bound), and 1.90 (1.62) for the never-GERD result. A confounder linked to both GLP-1RA use and cough by a risk ratio of about 1.5 each way could explain away the main finding. Is obesity that strong? Plausibly."}]}},{"id":"hill","type":"hill","nav":{"he":"ברדפורד היל","en":"Bradford Hill"},"he":{"title":"כרטיס הציונים של ברדפורד היל","lead":"תשעת הקריטריונים לסיבתיות, מול מה שהמאמר מראה. הציון הוא ההערכה שלנו, לא של המחברים.","scale":["חסר","חלש","חלקי","חזק"],"rows":[{"h":"עוצמת הקשר","s":1,"p":"חלשה: <bdi>aHR<\/bdi> בין <bdi>1.03<\/bdi> ל-<bdi>1.36<\/bdi>."},{"h":"עקביות","s":1,"p":"מאגר נתונים אחד. לא נבדק במקום אחר."},{"h":"ספציפיות","s":0,"p":"לשיעול כרוני יש סיבות רבות; התוצא לא ספציפי."},{"h":"רצף זמנים","s":2,"p":"חלקי: המרשם קודם לתוצא, אבל אין מינון ואין משך טיפול."},{"h":"מינון-תגובה","s":0,"p":"חסר. אין נתוני מינון, וקצר מול ארוך טווח אינו מדרג מינון."},{"h":"סבירות ביולוגית","s":2,"p":"קיימת: ריפלוקס, גירוי וגאלי, יובש. אף אחד לא נמדד."},{"h":"קוהרנטיות","s":1,"p":"חלשה: <bdi>GERD<\/bdi> כמעט לא עולה מול כל תרופה אחרת <bdi>(aHR 1.01)<\/bdi>."},{"h":"ניסוי","s":0,"p":"חסר: אין נתוני הפסקה וחזרה לתרופה."},{"h":"אנלוגיה","s":2,"p":"שיעול ממעכבי <bdi>ACE<\/bdi> מראה ששיעול מושרה תרופתית קיים, במנגנון אחר."}],"settleH":"מה היה מכריע את השאלה","settle":["אמולציה של ניסוי מטרה במשתמשים חדשים, <bdi>GLP-1RA<\/bdi> מול <bdi>SGLT2i<\/bdi>, עם <bdi>BMI<\/bdi> ו-<bdi>HbA1c<\/bdi>, תוצאי ביקורת שליליים, מינון והתמדה","סדרות מקרים של הפסקה וחזרה לתרופה במרפאות שיעול","ניתוח דיספרופורציה במאגר הפרמקו-ויג׳ילנס <bdi>FAERS<\/bdi>","עוקבה פרוספקטיבית עם <bdi>LCQ<\/bdi> או <bdi>Cough Severity Index<\/bdi> ו-<bdi>Reflux Symptom Index<\/bdi>","מבחן גירוי קפסאיצין לספי רגישות לשיעול, עם התרופה ובלעדיה"]},"en":{"title":"The Bradford Hill scorecard","lead":"The nine causal criteria against what the paper shows. The scores are our judgement, not the authors'.","scale":["Absent","Weak","Partial","Strong"],"rows":[{"h":"Strength","s":1,"p":"Weak: aHRs between 1.03 and 1.36."},{"h":"Consistency","s":1,"p":"One database. Untested anywhere else."},{"h":"Specificity","s":0,"p":"Chronic cough has many causes; the outcome is not specific."},{"h":"Temporality","s":2,"p":"Partial: prescription precedes outcome, but no dose and no duration."},{"h":"Dose-response","s":0,"p":"Absent. No dose data, and short vs long acting is not a dose gradient."},{"h":"Plausibility","s":2,"p":"Present: reflux, vagal stimulation, dryness. None measured."},{"h":"Coherence","s":1,"p":"Weak: GERD barely rises against any non-GLP-1RA (aHR 1.01)."},{"h":"Experiment","s":0,"p":"Absent: no dechallenge or rechallenge data."},{"h":"Analogy","s":2,"p":"ACE-inhibitor cough shows drug-induced cough exists, by a different mechanism."}],"settleH":"What would settle it","settle":["A target-trial emulation in new users, GLP-1RA vs SGLT2i, with BMI and HbA1c, negative-control outcomes, dose and persistence","Dechallenge and rechallenge case series in cough clinics","Pharmacovigilance disproportionality analysis in FAERS","A prospective cohort with the LCQ or Cough Severity Index and the Reflux Symptom Index","Capsaicin cough-challenge thresholds on and off the drug"]}},{"id":"clinic","type":"check","nav":{"he":"למרפאה","en":"In clinic"},"he":{"title":"מה עושים ביום ראשון במרפאה","lead":"רשימת בדיקה למטופל עם שיעול כרוני. סמנו תוך כדי.","items":["להוסיף <bdi>GLP-1RA<\/bdi> (וגם טירזפטייד) לרשימת התרופות באנמנזה של שיעול, ליד מעכבי <bdi>ACE<\/bdi>. לשאול ישירות: הרבה מקבלים אותה מחוץ לצוות הקבוע.","לתעד את התזמון: מתי התחיל השיעול ביחס לתחילת הטיפול או להעלאת המינון.","לברר ולטפל קודם בסיבות הרגילות: ניקוז אחורי, אסתמה, ברונכיטיס אאוזינופילית, ריפלוקס.","לחשוב על ריפלוקס של דרכי האוויר <bdi>(LPR)<\/bdi>, לא רק על חומצה: אמצעים התנהגותיים והיגיון פרוקינטי, לא רק הגדלת מינון <bdi>PPI<\/bdi>.","בתמונה נוירוגנית: מודולטורים עצביים, טיפול קול ודיבור, ולפי המחברים גם חסם של העצב הלרינגיאלי העליון.","ניסיון הפסקה רק יחד עם הרופא המטפל ועם המטופל, תוך שקילה של כ-<bdi>0.4<\/bdi> נקודות אחוז סיכון מוחלט מול התועלת המטבולית."]},"en":{"title":"What we do in clinic on Monday","lead":"A checklist for the patient with chronic cough. Tick as you go.","items":["Add GLP-1RA (and tirzepatide) to the cough medication history, next to ACE inhibitors. Ask directly: many get it outside their usual team.","Record the timing: when the cough began relative to starting the drug or a dose increase.","Work up and treat the usual causes first: postnasal drip, asthma, eosinophilic bronchitis, reflux.","Think airway reflux (LPR), not acid alone: behavioural measures and prokinetic logic, not PPI escalation alone.","For a neurogenic picture: neuromodulators, voice and speech therapy, and, as the authors suggest, a superior laryngeal nerve block.","A discontinuation trial only together with the prescriber and the patient, weighing about 0.4 points of absolute risk against the metabolic benefit."]}},{"id":"quiz","type":"quiz","nav":{"he":"חידון","en":"Quiz"},"he":{"title":"חמש שאלות לבדיקה עצמית","lead":"משוב מיידי והסבר אחרי כל תשובה.","qs":[{"q":"הסיכון בחמש שנים בטבלה: <bdi>3.58%<\/bdi> מול <bdi>3.15%<\/bdi>. מה ה-<bdi>NNH<\/bdi>?","o":["כ-<bdi>8<\/bdi> (<bdi>1<\/bdi> חלקי <bdi>12%<\/bdi>)","כ-<bdi>233<\/bdi>","כ-<bdi>1,000<\/bdi>"],"c":1,"e":"<bdi>1<\/bdi> חלקי <bdi>0.43<\/bdi> נקודות אחוז <bdi>(0.0043)<\/bdi> הוא כ-<bdi>233<\/bdi>. חישוב לפי ה-<bdi>12%<\/bdi> היחסיים מבלבל סיכון יחסי עם מוחלט."},{"q":"מול איזו קבוצה התוצאה העיקרית לא הייתה מובהקת?","o":["DPP-4i","SGLT2i","סולפונילאוריאה","כל תרופה אחרת"],"c":1,"e":"<bdi>SGLT2i<\/bdi>: <bdi>aHR 1.03 (0.98–1.09)<\/bdi>. רווח הסמך חוצה את <bdi>1<\/bdi>."},{"q":"למה קשה לקרוא את ה-<bdi>aHR<\/bdi> של <bdi>1.29<\/bdi> בקבוצה בלי <bdi>GERD<\/bdi> כ׳בלתי תלוי בריפלוקס׳?","o":["הקבוצה קטנה מדי","ההחרגה כוללת <bdi>GERD<\/bdi> שאובחן אחרי תחילת הטיפול, כלומר בחירה לפי משתנה שאחרי החשיפה","נעשה שימוש בקודים אחרים לשיעול","הקבוצות לא הותאמו"],"c":1,"e":"החרגת <bdi>GERD<\/bdi> ׳לפני או אחרי׳ מוציאה בדיוק את המקרים שבהם התרופה אולי גרמה לריפלוקס שקודד."},{"q":"מה אי-ההתאמה בתוצאה מול סולפונילאוריאה?","o":["<bdi>1.32 (1.24–1.40)<\/bdi> בתקציר מול <bdi>1.25 (1.18–1.32)<\/bdi> בטבלה <bdi>2<\/bdi>","<bdi>1.18<\/bdi> בתקציר מול <bdi>1.25<\/bdi> בטבלה <bdi>2<\/bdi>","<bdi>1.03<\/bdi> בתקציר מול <bdi>1.14<\/bdi> בטבלה <bdi>3<\/bdi>"],"c":0,"e":"התקציר מדווח <bdi>1.32 (1.24–1.40)<\/bdi>; טקסט התוצאות וטבלה <bdi>2<\/bdi> מדווחים <bdi>1.25 (1.18–1.32)<\/bdi>."},{"q":"מטופלת על סמאגלוטייד, שיעול כרוני חדש אחרי העלאת מינון. מה הצעד הסביר?","o":["להפסיק את התרופה מיד","להכפיל <bdi>PPI<\/bdi> ולחכות","לברר את הסיבות הרגילות, לשקול ריפלוקס של דרכי האוויר <bdi>(LPR)<\/bdi> ותמונה נוירוגנית, ובמקרה עמיד לדון בניסיון הפסקה עם הרופא המטפל","להתעלם, הקשר לא מובהק"],"c":2,"e":"הקשר מובהק אבל קטן במונחים מוחלטים. מטפלים קודם בסיבות הרגילות; הפסקה היא החלטה משותפת במקרה עמיד."}]},"en":{"title":"Five questions to test yourself","lead":"Instant feedback and an explanation after each answer.","qs":[{"q":"Printed 5-year risks: 3.58% vs 3.15%. What is the NNH?","o":["About 8 (1 divided by 12%)","About 233","About 1,000"],"c":1,"e":"1 divided by 0.43 percentage points (0.0043) is about 233. Working from the relative 12% confuses relative with absolute risk."},{"q":"Against which comparator was the main result not significant?","o":["DPP-4i","SGLT2i","Sulfonylurea","Any non-GLP-1RA"],"c":1,"e":"SGLT2i: aHR 1.03 (0.98–1.09). Its confidence interval crosses 1."},{"q":"Why is the never-GERD aHR of 1.29 hard to read as 'independent of reflux'?","o":["The cohort is too small","The exclusion includes GERD diagnosed after the drug was started, which is selection on a post-exposure variable","Different cough codes were used","The groups were not matched"],"c":1,"e":"Excluding GERD 'before or after' removes precisely the cases in which the drug may have caused a reflux that was coded."},{"q":"What is the inconsistency in the sulfonylurea result?","o":["1.32 (1.24–1.40) in the abstract vs 1.25 (1.18–1.32) in Table 2","1.18 in the abstract vs 1.25 in Table 2","1.03 in the abstract vs 1.14 in Table 3"],"c":0,"e":"The abstract reports 1.32 (1.24–1.40); the Results text and Table 2 report 1.25 (1.18–1.32)."},{"q":"A patient on semaglutide develops a new chronic cough after a dose increase. What is the sensible next step?","o":["Stop the drug at once","Double the PPI and wait","Work up the usual causes, consider airway reflux (LPR) and a neurogenic picture, and in refractory cases discuss a discontinuation trial with the prescriber","Ignore it, the association is not significant"],"c":2,"e":"The association is significant but small in absolute terms. Treat the usual causes first; stopping is a shared decision for refractory cases."}]}},{"id":"closing","type":"closing","nav":{"he":"מקור","en":"Source"},"he":{"title":"המקור","cite":"Gallagher TJ, Razura DE, Li A, Kim I, Vukkadala N, Barbu AM. Glucagon-like peptide-1 receptor agonists and chronic cough. JAMA Otolaryngol Head Neck Surg. Published online November 26, 2025. doi:10.1001/jamaoto.2025.4181","notes":["החומרים הוכנו למועדון ז׳ורנל ואינם ייעוץ רפואי.","כל הגרפים שורטטו מחדש מהמספרים המודפסים במאמר. ה-<bdi>NNH<\/bdi>, ההפרשים המוחלטים וה-<bdi>E-values<\/bdi> חושבו על ידינו מאותם מספרים.","המאמר © <bdi class=\"w\">2025 American Medical Association<\/bdi>. הטקסט כאן הוא פרפרזה; הציטוט היחיד מסומן ומיוחס."],"presented":"מציג: נתנאל רפואה"},"en":{"title":"The source","cite":"Gallagher TJ, Razura DE, Li A, Kim I, Vukkadala N, Barbu AM. Glucagon-like peptide-1 receptor agonists and chronic cough. JAMA Otolaryngol Head Neck Surg. Published online November 26, 2025. doi:10.1001/jamaoto.2025.4181","notes":["Materials prepared for journal club; not medical advice.","Every chart is redrawn from the numbers printed in the paper. The NNH, absolute differences and E-values are our own calculations from those numbers.","Paper © 2025 American Medical Association. The text here is paraphrase; the one quotation is marked and attributed."],"presented":"Presenter: Netanel Refoua"}}],"ui":{"he":{"brand":"מועדון ז׳ורנל אא״ג","prev":"הקודם","next":"הבא","map":"מפת המסע","close":"סגירה","hint":"חיצים, החלקה או לחיצה על המפה","start":"יוצאים לדרך","lang":"English","tapRow":"הקישו על שורה כדי לראות את הפרטים","reveal":"חשיפה","found":"נחשפו","flip":"הפכו את הכרטיס","flipBack":"חזרה לשאלה","qNext":"לשאלה הבאה","qAgain":"מתחילים מחדש","qScore":"תוצאה","correct":"נכון.","wrong":"לא בדיוק.","done":"סומנו","copy":"העתקת הציטוט","copied":"הועתק","toStart":"חזרה להתחלה","events":"אירועים","n":"גודל קבוצה","fu":"מעקב חציוני (ימים)","vs":"מול","legendG":"GLP-1RA","legendC":"קבוצת השוואה","abstractGhost":"הערך שבתקציר","axis":"יחס סיכונים מתוקנן, סקאלה לוגריתמית","noDiff":"אין הבדל"},"en":{"brand":"ENT journal club","prev":"Back","next":"Next","map":"Journey map","close":"Close","hint":"Arrow keys, swipe, or open the map","start":"Start the journey","lang":"עברית","tapRow":"Tap a row to see the details","reveal":"Reveal","found":"Revealed","flip":"Flip the card","flipBack":"Back to the question"," /* overview map */
function openOv(){var g=$('ovgrid');g.innerHTML=S.map(function(s,k){return '<button data-k="'+k+'" class="'+(k===cur?'cur':'')+'"><span class="num">'+(k+1)+'</span><span class="nm">'+s.nav[lang]+'</span></button>';}).join('');
  [].forEach.call(g.children,function(b){b.onclick=function(){closeOv();go(+b.dataset.k);};});$('overview').classList.add('on');(g.children[cur]||g.children[0]).focus();}
function closeOv(){$('overview').classList.remove('on');$('mapbtn').focus();}
$('mapbtn').onclick=openOv;$('ovclose').onclick=closeOv;
/* language */
function setLang(l){lang=l;try{localStorage.setItem('glp1cough.lang',l);}catch(e){}var h=document.documentElement;h.lang=l;h.dir=l==='he'?'rtl':'ltr';
  document.title=l==='he'?'GLP-1RA ושיעול כרוני · מועדון ז׳ורנל':'GLP-1RAs and chronic cough · Journal club';
  $('brand').textContent=L().brand;$('mapbtn').textContent=L().map;$('ovclose').textContent=L().close;$('langbtn').textContent=L().lang;$('langbtn').setAttribute('lang',l==='he'?'en':'he');$('hint').textContent=L().hint;
  renderAll();paint();}
$('langbtn').onclick=function(){setLang(lang==='he'?'en':'he');};
window.addEventListener('hashchange',function(){var i=S.map(function(s){return s.id;}).indexOf(location.hash.slice(1));if(i>=0&&i!==cur)go(i);});
var h0=S.map(function(s){return s.id;}).indexOf(location.hash.slice(1));cur=h0>=0?h0:0;
setLang(lang);
})();
</script>
</body>
